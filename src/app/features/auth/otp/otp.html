<div class="otp-container">
  <div class="otp-card">

    <h2>Verify OTP</h2>
    <p>Enter the OTP sent to your registered contact.</p>

    <form [formGroup]="otpForm" (ngSubmit)="onVerifyOtp()">

      <div class="form-group">
        <label for="otp">OTP</label>

        <input type="text" id="otp" maxlength="6" formControlName="otp" placeholder="Enter 6-digit OTP" />

        @if (otpForm.get('otp')?.touched &&
        otpForm.get('otp')?.hasError('required')) {
        <small>OTP is required.</small>
        }

        @if (otpForm.get('otp')?.touched &&
        otpForm.get('otp')?.hasError('minlength')) {
        <small>OTP must be 6 digits.</small>
        }

      </div>

      <button type="submit">
        Verify OTP
      </button>

    </form>

    <p class="resend-text">
      Didn't receive the OTP?
      <button type="button" (click)="onResendOtp()">
        Resend OTP
      </button>
    </p>

  </div>
</div>
